name: Build iPhone .ipa

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Move files to root if in subfolder
        run: |
          if [ ! -f package.json ]; then
            SUBDIR=$(find . -maxdepth 2 -mindepth 2 -name package.json | head -n 1 | xargs dirname)
            if [ -n "$SUBDIR" ]; then
              echo "Moving files from $SUBDIR to main folder..."
              mv "$SUBDIR"/* .
              mv "$SUBDIR"/.* . 2>/dev/null || true
            fi
          fi
          ls -la package.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install packages
        run: bun install

      - name: Build the game bundle
        run: bun run build:cap

      - name: Copy game into iOS project
        run: bunx cap sync ios

      - name: Build app without signing
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/App/build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Package .ipa
        run: |
          mkdir -p payload/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app payload/Payload/
          cd payload && zip -qry ../SunnyLinks.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SunnyLinks-ipa
          path: SunnyLinks.ipa
          retention-days: 30
