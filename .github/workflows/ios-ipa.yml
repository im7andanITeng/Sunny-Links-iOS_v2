name: Build iPhone .ipa

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install packages
        run: bun install

      - name: Build the game bundle
        run: bun run build:cap

      - name: Copy game into iOS project
        run: bunx cap sync ios

      - name: Build app without signing
        run: >
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/App/build
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY=""
          build

      - name: Package .ipa
        run: |
          mkdir -p payload/Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app payload/Payload/
          cd payload && zip -qry ../SunnyLinks.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SunnyLinks-ipa
          path: SunnyLinks.ipa
          retention-days: 30
